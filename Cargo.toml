[package]
name = "claude-opus-mcp"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Facade Rust claude-opus-gateway : mcp-framework-rs + upstream Python astra-mcp (tools opus_*, Claude Opus 5.5)"
publish = false

[workspace]

[lib]
name = "claude_opus_mcp"
path = "src/lib.rs"

[[bin]]
name = "claude-opus-mcp"
path = "src/main.rs"

[dependencies]
mcp-core = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "df943a629a0379fdaff45278377f9ffcab3c08f4", version = "0.3.0" }
mcp-http = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "df943a629a0379fdaff45278377f9ffcab3c08f4", version = "0.3.0" }
mcp-auth = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "df943a629a0379fdaff45278377f9ffcab3c08f4", version = "0.3.0" }
mcp-observe = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "df943a629a0379fdaff45278377f9ffcab3c08f4", version = "0.3.0" }
mcp-gateway = { git = "https://github.com/Revens2/mcp-framework-rs", rev = "df943a629a0379fdaff45278377f9ffcab3c08f4", version = "0.3.0" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tracing = { version = "0.1" }
serde_json = { version = "1" }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-manual-roots"] }
zeroize = { version = "1" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["full"] }
serde_json = { version = "1" }
